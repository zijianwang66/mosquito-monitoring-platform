<section class="map-panel" style="margin-top:16px"><details><summary>填写捕蚊数据与调整扩散值</summary><form id="model"><p>每台设备填同一采样时段的捕获数。空白表示缺测，0 表示零捕获。</p><div id="counts" class="counts"></div><label>影响半径（图纸像素） <input name="radius" type="number" required min="10" max="800" step="1" value="220"></label> <button type="submit">重新估算</button><p id="status" aria-live="polite"></p></form></details></section><footer>底图使用局部图纸坐标，分区边界为演示划定。读数和模型结果均为演示。</footer>
</main><script>const gis={"coordinateSystem":{"type":"local-image","unit":"px","origin":"top-left","width":768,"height":747,"metersPerPixel":null},"boundary":[[224,22],[610,22],[726,43],[712,365],[691,618],[647,713],[41,713],[41,234],[224,234],[224,22]],"buildings":[[[63,177],[204,177],[204,271],[63,271],[63,177]],[[54,493],[165,493],[165,691],[54,691],[54,493]],[[262,515],[479,515],[479,566],[262,566],[262,515]],[[479,314],[606,314],[606,561],[479,561],[479,314]]],"zones":[{"name":"中央空地","polygon":[[337,380],[446,380],[446,484],[337,484],[337,380]]},{"name":"北侧健身区","polygon":[[318,151],[357,120],[423,128],[454,173],[465,220],[401,213],[346,222],[318,192],[318,151]]}],"traps":[{"id":"M01","x":254,"y":162},{"id":"M02","x":450,"y":237},{"id":"M03","x":657,"y":155},{"id":"M04","x":207,"y":362},{"id":"M05","x":447,"y":350},{"id":"M06","x":651,"y":465},{"id":"M07","x":199,"y":621},{"id":"M08","x":417,"y":616},{"id":"M09","x":659,"y":643}]};
const demo=[6,3,8,7,12,23,5,9,17];
const form=document.querySelector('#model');
const fields=document.querySelector('#counts');
fields.innerHTML=gis.traps.map(({id},i)=>'<label>'+id+' <input name="'+id+'" type="number" min="0" max="1000000" step="1" inputmode="numeric" value="'+demo[i]+'"></label>').join('');
function inside(x,y,polygon){
  let hit=false;
  for(let i=0,j=polygon.length-1;i<polygon.length;j=i++){
    const [a,b]=polygon[i], [c,d]=polygon[j];
    if((b>y)!==(d>y) && x<(c-a)*(y-b)/(d-b)+a) hit=!hit;
  }
  return hit;
}
function estimate(x,y,points,radius){
  const nearby=points.map(point=>({...point,d:Math.hypot(x-point.x,y-point.y)})).filter(point=>point.d<=radius);
  if(nearby.length<2) return null;
  const exact=nearby.find(point=>point.d===0);
  if(exact) return exact.value;
  let weighted=0,weights=0;
  for(const {d,value} of nearby){
    const weight=(1-d/radius)/(d*d);
    weights+=weight;
    weighted+=weight*value;
  }
  return weights>0?weighted/weights:null;
}
function calculate(){
  const points=gis.traps.flatMap(trap=>{
    const input=form.elements.namedItem(trap.id);
    return input.value===''?[]:[{...trap,value:input.valueAsNumber}];
  });
  const radius=form.elements.radius.valueAsNumber;
  const step=10;
  const summaries=gis.zones.map(()=>({total:0,covered:0,sum:0}));
  const grid=[];
  const color=value=>value<6?'#72dfb6':value<12?'#cedf98':value<18?'#ffda87':'#ffad62';
  for(let y=5;y<gis.coordinateSystem.height;y+=step){
    for(let x=5;x<gis.coordinateSystem.width;x+=step){
      if(!inside(x,y,gis.boundary)||gis.buildings.some(p=>inside(x,y,p))) continue;
      const value=estimate(x,y,points,radius);
      if(value!==null) grid.push('<rect x="'+(x-5)+'" y="'+(y-5)+'" width="10" height="10" fill="'+color(value)+'"/>');
      gis.zones.forEach(({polygon},i)=>{
        if(!inside(x,y,polygon)) return;
        const stat=summaries[i];
        stat.total++;
        if(value!==null){stat.covered++;stat.sum+=value;}
      });
    }
  }
  document.querySelector('#surface').innerHTML=grid.join('');
  document.querySelector('#areas').innerHTML=gis.zones.map(({polygon},i)=>{
    const [x,y]=polygon[0];
    return '<polygon points="'+polygon.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#e9ffec" stroke-width="2" stroke-dasharray="5 4"/><text x="'+x+'" y="'+(y-6)+'" fill="#effaf0" font-size="21" paint-order="stroke" stroke="#102622" stroke-width="5">'+gis.zones[i].name+'</text>';
  }).join('');
  document.querySelector('#results').innerHTML=summaries.map(({total,covered,sum},i)=>{
    const percent=Math.round(100*covered/total);
    const reading=covered===0||covered/total<.5?'覆盖不足，暂不估算':(sum/covered).toFixed(1)+' 只/台·时段';
    return '<p><strong>'+gis.zones[i].name+' · '+reading+'</strong><br><small>估算覆盖 '+percent+'% · 按已覆盖网格取平均</small></p>';
  }).join('');
  document.querySelector('#status').textContent='已计算 · '+points.length+' 个有效点位 · 影响半径 '+radius+' px';
}
form.addEventListener('submit',event=>{event.preventDefault();calculate();});
calculate();</script></body></html>
